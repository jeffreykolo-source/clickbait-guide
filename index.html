<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickbait Guide</title>
  <style>
    :root {
        --bg-dark: #121212;
        --accent-orange: #ff9d00;
        --text-main: #e0e0e0;
        --red-bait: #721c24;
        --green-real: #155724;
    }

    * { box-sizing: border-box; }

    body { 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        background: var(--bg-dark); 
        color: var(--text-main); 
        margin: 0; padding: 0;
        overflow-x: hidden; 
    }

    #slider-container { 
        position: relative; 
        width: 100vw; 
        height: 100vh; 
        background: #000;
    }

    .slide {
        position: absolute; 
        top: 0; left: 0; width: 100%; height: 100%;
        opacity: 0; visibility: hidden; 
        transition: opacity 0.5s ease-in-out;
        display: flex; 
        justify-content: center; 
        align-items: center; /* Desktop: Vertical Center */
    }

    .slide.active { opacity: 1; visibility: visible; }

    /* --- THE CONTENT LAYER --- */
    .content-layer { 
        display: flex; 
        width: 90%; 
        max-width: 1000px; 
        gap: 40px; 
        align-items: flex-start; 
        position: relative;
    }

    .layout-img-left { flex-direction: row; }
    .layout-img-right { flex-direction: row-reverse; }

    .layout-hero { background-size: cover; background-position: center; }
    .hero-content { 
        text-align: center; background: rgba(0,0,0,0.85); 
        padding: 50px; border-radius: 15px; border: 2px solid var(--accent-orange);
        max-width: 750px; margin: 0 auto;
    }

    .image-side { 
        width: 300px; height: 450px; flex: 0 0 300px;
        border-radius: 12px; overflow: hidden; border: 1px solid #444;
    }
    .img-fill { width: 100%; height: 100%; background-size: cover; background-position: center; }

    .text-side { 
        flex: 1; 
        min-height: 450px; 
        display: flex; flex-direction: column; 
    }

    h2 { font-size: 2.2rem; color: var(--accent-orange); margin: 0 0 15px 0; line-height: 1.1; }
    .body-p { font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }

    .flip-container { perspective: 1000px; cursor: pointer; height: 140px; margin-top: auto; }
    .flip-card { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
    .flip-card.revealed { transform: rotateY(180deg); }
    .flip-front, .flip-back {
        position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        border-radius: 10px; padding: 15px; text-align: center; font-size: 1rem; font-weight: bold;
    }
    .flip-front { background: var(--red-bait); color: #f8d7da; border: 1px solid #f5c6cb; }
    .flip-back { background: var(--green-real); color: #d4edda; border: 1px solid #c3e6cb; transform: rotateY(180deg); }

    .next-btn {
        position: absolute;
        bottom: -70px; right: 0; 
        padding: 12px 35px; 
        background: var(--accent-orange); 
        border: none; border-radius: 6px; 
        color: #000; font-weight: bold; cursor: pointer;
    }

    /* --- THE MOBILE RE-ORIENTATION --- */
    @media (max-width: 750px) {
        body { overflow-y: auto; } /* Allow scrolling for long descriptions */
        
        #slider-container { 
            height: auto; 
            min-height: 100vh; 
        }

        .slide { 
            position: relative; /* Change from absolute to relative to stack slides */
            height: auto; 
            min-height: 100vh;
            align-items: flex-start; /* CRITICAL: Force content to top */
            padding-top: 20px;      /* Slight gap from the very top */
            padding-bottom: 60px;   /* Room for the button at the bottom */
        }

        .content-layer { 
            flex-direction: column !important; 
            align-items: center; 
            width: 95%; 
            gap: 20px; 
            margin-top: 0; /* Remove any top centering margins */
        }

        .hero-content { padding: 30px 15px; width: 95%; }

        .image-side { 
            width: 260px; 
            height: 390px; 
            flex: none; 
        }

        .text-side { 
            width: 100%; 
            min-height: auto; 
            text-align: center; 
        }

        h2 { font-size: 1.8rem; }

        .flip-container { margin-top: 20px; }

        .next-btn { 
            position: relative; 
            bottom: 0; 
            margin: 40px auto 20px auto; 
            display: block;
        }
    }
</style>
</head>
<body>

<div id="slider-container">
    <div style="color: white; text-align: center; padding-top: 50px;">Loading Lesson Data...</div>
</div>

<script>
// 1. MUST BE THE "PUBLISHED TO WEB" CSV LINK
// It should look like: https://docs.google.com/spreadsheets/d/e/.../pub?output=csv
const spreadsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0lbYPGDQoHbi7SKYJMpAaSwOkMUBMjlQ79IaQnieQi-SCQCycYJrsxtbfulq4odFFI_V1dwcF_kCB/pub?gid=0&single=true&output=csv'; // Replace with your published CSV link

let currentSlide = 0;

async function init() {
    const container = document.getElementById('slider-container');
    console.log("Attempting to fetch data from:", spreadsheetUrl);

    // Timeout safety: If it takes more than 5 seconds, show a manual error
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);

    try {
        const response = await fetch(spreadsheetUrl, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const csvText = await response.text();
        clearTimeout(timeoutId);

        console.log("CSV Data Received. Length:", csvText.length);
        const masterData = parseCSV(csvText);
        
        if (masterData.length > 0) {
            render(masterData);
        } else {
            throw new Error("CSV parsed but no rows found.");
        }

    } catch (e) {
        console.error("Initialization Error:", e);
        container.innerHTML = `
            <div style="color: white; text-align: center; padding: 50px; font-family: sans-serif;">
                <h2 style="color: #ff9d00;">Connection Issue</h2>
                <p>Could not load the spreadsheet. Please check:</p>
                <ul style="display: inline-block; text-align: left; line-height: 1.6;">
                    <li>Is the Google Sheet <b>Published to Web</b> as a <b>CSV</b>?</li>
                    <li>Is the URL in the code correct?</li>
                    <li>Are you connected to the internet?</li>
                </ul>
                <p style="font-size: 0.8rem; color: #888; margin-top: 20px;">Error Details: ${e.message}</p>
            </div>`;
    }
}

function parseCSV(text) {
    // Splits lines and handles potential Windows/Mac line ending differences
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const rawHeaders = lines[0].split(',').map(h => h.trim().toLowerCase());
    
    console.log("Detected Headers:", rawHeaders);

    return lines.slice(1).map((line, index) => {
        // Advanced regex to handle commas inside quotes
        const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
        let obj = {};
        
        rawHeaders.forEach((header, i) => {
            let val = values[i] || '';
            // Robust mapping: looks for keywords regardless of the full column name
            if (header.includes('title')) obj['title'] = val;
            if (header.includes('description')) obj['description'] = val;
            if (header.includes('image_url')) obj['image_url'] = val;
            if (header.includes('layout')) obj['layout'] = val;
            if (header.includes('caption')) obj['caption'] = val;
            if (header.includes('quote')) obj['quote'] = val;
        });
        return obj;
    });
}

function render(data) {
    const container = document.getElementById('slider-container');
    container.innerHTML = '';
    
    data.forEach((item, i) => {
        const slide = document.createElement('div');
        // Layout check: Is it the first slide, or marked 'hero' or '1'?
        const isHero = i === 0 || (item.layout && (item.layout.toLowerCase() === 'hero' || item.layout == '1'));
        const isImgRight = (item.layout == '2');

        slide.className = `slide ${isHero ? 'layout-hero' : (isImgRight ? 'layout-img-right' : 'layout-img-left')}`;
        
        if (isHero) {
            slide.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('${item.image_url}')`;
            slide.innerHTML = `
                <div class="content-layer">
                    <div class="hero-content">
                        <h1>${item.title || 'Untitled'}</h1>
                        <p style="font-size: 1.4rem; color: var(--accent-orange); font-style: italic;">
                            ${item.caption ? `"${item.caption}"` : ''}
                        </p>
                        ${item.quote ? `<p style="margin-top:20px; opacity:0.8;">${item.quote}</p>` : ''}
                    </div>
                    <button class="next-btn" onclick="nextSlide()">Start Guide</button>
                </div>`;
        } else {
            slide.innerHTML = `
                <div class="content-layer">
                    <div class="image-side">
                        <div class="img-fill" style="background-image: url('${item.image_url}')"></div>
                    </div>
                    <div class="text-side">
                        <h2>${item.title || 'Untitled'}</h2>
                        <p class="body-p">${item.description || ''}</p>
                        
                        ${item.quote ? `
                        <div class="flip-container" onclick="this.querySelector('.flip-card').classList.toggle('revealed')">
                            <div class="flip-card">
                                <div class="flip-front">
                                    <div style="font-size: 0.7rem; text-transform: uppercase; margin-bottom: 10px; opacity:0.7;">The Headline</div>
                                    "${item.caption || 'Clickbait Headline'}"
                                    <div style="font-size: 0.7rem; margin-top: 10px; font-weight: normal; opacity:0.6;">Click to reveal reality</div>
                                </div>
                                <div class="flip-back">
                                    <div style="font-size: 0.7rem; text-transform: uppercase; margin-bottom: 10px; opacity:0.7;">The Reality</div>
                                    ${item.quote}
                                </div>
                            </div>
                        </div>` : ''}
                    </div>
                    <button class="next-btn" onclick="nextSlide()">
                        ${i === data.length - 1 ? 'Restart' : 'Continue'}
                    </button>
                </div>`;
        }
        container.appendChild(slide);
    });
    showSlide(0);
}

function showSlide(index) {
    const slides = document.querySelectorAll('.slide');
    if (slides.length === 0) return;
    slides.forEach(s => s.classList.remove('active'));
    slides[index].classList.add('active');
}

function nextSlide() {
    const slides = document.querySelectorAll('.slide');
    currentSlide = (currentSlide + 1) % slides.length;
    showSlide(currentSlide);
}

// Start the process
init();
</script>
</body>
</html>
