<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickbait Guide</title>
    <style>
        :root {
            --bg-dark: #121212;
            --accent-orange: #ff9d00;
            --text-main: #e0e0e0;
            --red-bait: #721c24;
            --green-real: #155724;
        }

        * { box-sizing: border-box; } /* Prevents width issues */

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; padding: 0;
            overflow-x: hidden; 
        }

        #slider-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #000;
        }

        .slide {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; visibility: hidden; 
            transition: opacity 0.5s ease-in-out;
            display: flex; justify-content: center; align-items: center;
        }

        .slide.active { opacity: 1; visibility: visible; }

        /* --- THE CONTENT LAYER --- */
        .content-layer { 
            display: flex; 
            width: 90%; 
            max-width: 1000px; 
            gap: 50px; 
            align-items: flex-start; 
            position: relative;
            padding-bottom: 100px; /* Space for the button at bottom */
        }

        .layout-img-left { flex-direction: row; }
        .layout-img-right { flex-direction: row-reverse; }

        /* HERO SLIDE */
        .layout-hero { background-size: cover; background-position: center; }
        .hero-content { 
            text-align: center; background: rgba(0,0,0,0.85); 
            padding: 60px; border-radius: 15px; border: 2px solid var(--accent-orange);
            max-width: 750px; margin: 0 auto;
        }

        /* --- IMAGE (300x450) --- */
        .image-side { 
            width: 300px; height: 450px; flex: 0 0 300px;
            border-radius: 12px; overflow: hidden; border: 1px solid #444;
        }
        .img-fill { width: 100%; height: 100%; background-size: cover; background-position: center; }

        /* --- TEXT SYSTEM --- */
        .text-side { 
            flex: 1; 
            min-height: 450px; 
            display: flex; flex-direction: column; 
            justify-content: flex-start; 
        }

        h2 { font-size: 2.4rem; color: var(--accent-orange); margin: 0 0 15px 0; line-height: 1.1; }
        .body-p { font-size: 1.15rem; line-height: 1.6; margin-bottom: 20px; }

        /* --- FLIP BOX --- */
        .flip-container { perspective: 1000px; cursor: pointer; height: 150px; margin-top: auto; }
        .flip-card { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.revealed { transform: rotateY(180deg); }
        .flip-front, .flip-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; padding: 20px; text-align: center; font-size: 1.1rem; font-weight: bold;
        }
        .flip-front { background: var(--red-bait); color: #f8d7da; border: 1px solid #f5c6cb; }
        .flip-back { background: var(--green-real); color: #d4edda; border: 1px solid #c3e6cb; transform: rotateY(180deg); }

        /* --- BUTTON (Fixed Bottom Right) --- */
        .next-btn {
            position: absolute;
            bottom: 10px; right: 0; 
            padding: 14px 40px; 
            background: var(--accent-orange); 
            border: none; border-radius: 8px; 
            color: #000; font-weight: bold; cursor: pointer;
        }

        /* --- MOBILE FIX --- */
        @media (max-width: 700px) {
            body { overflow-y: auto; }
            #slider-container { height: auto; min-height: 100vh; }
            .slide { position: relative; height: auto; padding: 40px 0 100px 0; }
            .content-layer { 
                flex-direction: column !important; 
                align-items: center; 
                width: 92%; /* Improved mobile width */
                gap: 25px; 
                padding-bottom: 80px;
            }
            .image-side { width: 280px; height: 420px; flex: none; }
            .text-side { width: 100%; min-height: auto; text-align: center; }
            .next-btn { position: relative; bottom: 0; margin: 30px auto 0 auto; }
        }
    </style>
</head>
<body>

</div>
