<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clickbait Guide & Quiz</title>
    <style>
        :root {
            --bg-dark: #121212;
            --accent-orange: #ff9d00;
            --text-main: #e0e0e0;
            --red-bait: #721c24;
            --green-real: #155724;
            --card-bg: #1e1e1e;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; padding: 0;
            overflow-x: hidden; 
        }

        #slider-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
            background: #000;
        }

        .slide {
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; 
            display: none; 
            transition: opacity 0.5s ease-in-out;
            justify-content: center; 
            align-items: center; 
        }

        .slide.active { 
            opacity: 1; 
            display: flex; 
        }

        .content-layer { 
            display: flex; 
            width: 90%; 
            max-width: 1000px; 
            gap: 40px; 
            align-items: flex-start; 
            position: relative;
        }

        .layout-img-left { flex-direction: row; }
        .layout-img-right { flex-direction: row-reverse; }

        .layout-hero { background-size: cover; background-position: center; }
        .hero-content { 
            text-align: center; background: rgba(0,0,0,0.85); 
            padding: 50px; border-radius: 15px; border: 2px solid var(--accent-orange);
            max-width: 750px; margin: 0 auto;
        }

        .image-side { 
            width: 300px; height: 450px; flex: 0 0 300px;
            border-radius: 12px; overflow: hidden; border: 1px solid #444;
        }
        .img-fill { width: 100%; height: 100%; background-size: cover; background-position: center; }

        .text-side { 
            flex: 1; 
            min-height: 450px; 
            display: flex; flex-direction: column; 
        }

        h2 { font-size: 2.2rem; color: var(--accent-orange); margin: 0 0 15px 0; line-height: 1.1; }
        .body-p { font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; }

        .flip-container { perspective: 1000px; cursor: pointer; height: 140px; margin-top: auto; }
        .flip-card { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flip-card.revealed { transform: rotateY(180deg); }
        .flip-front, .flip-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 10px; padding: 15px; text-align: center; font-size: 1rem; font-weight: bold;
        }
        .flip-front { background: var(--red-bait); color: #f8d7da; border: 1px solid #f5c6cb; }
        .flip-back { background: var(--green-real); color: #d4edda; border: 1px solid #c3e6cb; transform: rotateY(180deg); }

        .next-btn {
            position: absolute;
            bottom: -70px; right: 0; 
            padding: 12px 35px; 
            background: var(--accent-orange); 
            border: none; border-radius: 6px; 
            color: #000; font-weight: bold; cursor: pointer;
        }

        /* --- QUIZ SPECIFIC STYLES --- */
        .quiz-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #333;
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }
        .quiz-option {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
            text-align: left;
        }
        .quiz-option:hover {
            background: #3a3a3a;
            border-color: var(--accent-orange);
        }
        .quiz-option.correct { background: var(--green-real); border-color: #c3e6cb; }
        .quiz-option.wrong { background: var(--red-bait); border-color: #f5c6cb; }

        /* --- REPORT CARD SYSTEM --- */
        .report-card {
            text-align: center;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 15px;
            border: 2px dashed var(--accent-orange);
            max-width: 500px;
            margin: 0 auto;
        }
        .rank-title {
            font-size: 2rem;
            color: var(--accent-orange);
            margin: 20px 0;
            font-weight: bold;
        }

        /* --- MOBILE RE-ORIENTATION --- */
        @media (max-width: 750px) {
            body { overflow-y: auto; } 
            #slider-container { height: auto; min-height: 100vh; }
            .slide { 
                position: relative; height: auto; min-height: 100vh;
                align-items: flex-start; padding-top: 20px; padding-bottom: 60px;
            }
            .content-layer { flex-direction: column !important; align-items: center; width: 95%; gap: 20px; }
            .hero-content { padding: 30px 15px; width: 95%; }
            .image-side { width: 260px; height: 390px; flex: none; }
            .text-side { width: 100%; min-height: auto; text-align: center; }
            h2 { font-size: 1.8rem; }
            .flip-container { margin-top: 20px; }
            .next-btn { position: relative; bottom: 0; margin: 40px auto 20px auto; display: block; }
            .quiz-container { padding: 20px 15px; }
        }
    </style>
</head>
<body>

<div id="slider-container">
    <div style="color: white; text-align: center; padding-top: 50px;">Loading Lesson Data...</div>
</div>

<script>
const spreadsheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS0lbYPGDQoHbi7SKYJMpAaSwOkMUBMjlQ79IaQnieQi-SCQCycYJrsxtbfulq4odFFI_V1dwcF_kCB/pub?output=csv'; 
    
let currentSlide = 0;
let totalPresentationSlides = 0;
let userScore = 0;

// The 6 Quiz Questions based on your lesson categories
const quizQuestions = [
    {
        headline: "You'll Never Guess What This Teacher Found Under the Bleachers!",
        question: "Which clickbait technique is being used here?",
        options: ["Exaggeration", "The Curiosity Gap", "Lists", "Vague Language"],
        answer: 1 // The Curiosity Gap
    },
    {
        headline: "This Mind-Blowing Diet Hack Will Completely Restructure Your DNA Overnight!",
        question: "Which clickbait technique is being used here?",
        options: ["Bait-and-Switch", "Emotional Trigger Words", "Exaggeration", "The Curiosity Gap"],
        answer: 2 // Exaggeration
    },
    {
        headline: "Are You Making This Catastrophic Financial Mistake With Your Paycheck?",
        question: "Which clickbait technique is being used here?",
        options: ["Emotional Trigger Words", "Vague Language", "Lists", "Bait-and-Switch"],
        answer: 0 // Emotional Trigger Words
    },
    {
        headline: "This One Exercise Will Supercharge Your Workouts Instantly.",
        question: "Which clickbait technique is being used here?",
        options: ["Lists", "The Curiosity Gap", "Exaggeration", "Vague Language"],
        answer: 3 // Vague Language
    },
    {
        headline: "The 3 Tiny Dietary Adjustments That May Save Your Life.",
        question: "Which clickbait technique is being used here?",
        options: ["Lists", "Bait-and-Switch", "Emotional Trigger Words", "The Curiosity Gap"],
        answer: 0 // Lists
    },
    {
        headline: "Get Paid $1,000 a Month To Just Watch Movies All Day!",
        question: "Which clickbait technique is being used here?",
        options: ["Exaggeration", "Vague Language", "Bait-and-Switch", "The Curiosity Gap"],
        answer: 2 // Bait-and-Switch
    }
];

async function init() {
    try {
        const response = await fetch(spreadsheetUrl);
        const csvText = await response.text();
        const masterData = parseCSV(csvText);
        render(masterData);
    } catch (e) { console.error(e); }
}

function parseCSV(text) {
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
    const rawHeaders = lines[0].split(',').map(h => h.trim().toLowerCase());
    
    return lines.slice(1).map(line => {
        const values = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.trim().replace(/^"|"$/g, ''));
        let obj = {};
        rawHeaders.forEach((header, i) => {
            let key = header;
            if (header.includes('title')) key = 'title';
            else if (header.includes('description')) key = 'description';
            else if (header.includes('image_url')) key = 'image_url';
            else if (header.includes('layout')) key = 'layout';
            else if (header.includes('caption')) key = 'caption';
            else if (header.includes('quote')) key = 'quote';
            obj[key] = values[i] || '';
        });
        return obj;
    });
}

function render(data) {
    const container = document.getElementById('slider-container');
    container.innerHTML = '';
    totalPresentationSlides = data.length;
    
    data.forEach((item, i) => {
        const slide = document.createElement('div');
        const isHero = i === 0 || (item.layout && (item.layout.toLowerCase() === 'hero' || item.layout == '1'));
        const isImgRight = (item.layout == '2');
        slide.className = `slide ${isHero ? 'layout-hero' : (isImgRight ? 'layout-img-right' : 'layout-img-left')}`;
        slide.id = `slide-${i}`;
        
        if (isHero) {
            slide.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('${item.image_url}')`;
            slide.innerHTML = `
                <div class="content-layer">
                    <div class="hero-content">
                        <h1>${item.title}</h1>
                        <p style="font-size: 1.4rem; color: var(--accent-orange); font-style: italic;">"${item.caption}"</p>
                        ${item.quote ? `<p style="margin-top:20px; opacity:0.8;">${item.quote}</p>` : ''}
                    </div>
                    <button class="next-btn" onclick="nextSlide()">Start Guide</button>
                </div>`;
        } else {
            slide.innerHTML = `
                <div class="content-layer">
                    <div class="image-side">
                        <div class="img-fill" style="background-image: url('${item.image_url}')"></div>
                    </div>
                    <div class="text-side">
                        <h2>${item.title}</h2>
                        <p class="body-p">${item.description}</p>
                        
                        ${item.quote ? `
                        <div class="flip-container" onclick="this.querySelector('.flip-card').classList.toggle('revealed')">
                            <div class="flip-card">
                                <div class="flip-front">
                                    <div style="font-size: 0.7rem; text-transform: uppercase; margin-bottom: 10px; opacity:0.7;">The Headline</div>
                                    "${item.caption}"
                                    <div style="font-size: 0.7rem; margin-top: 10px; font-weight: normal; opacity:0.6;">Click to reveal reality</div>
                                </div>
                                <div class="flip-back">
                                    <div style="font-size: 0.7rem; text-transform: uppercase; margin-bottom: 10px; opacity:0.7;">The Reality</div>
                                    ${item.quote}
                                </div>
                            </div>
                        </div>` : ''}
                    </div>
                    <button class="next-btn" onclick="nextSlide()">
                        ${i === data.length - 1 ? 'Go to Quiz' : 'Continue'}
                    </button>
                </div>`;
        }
        container.appendChild(slide);
    });
    
    buildQuizSlides(container);
    showSlide(0);
}

function buildQuizSlides(container) {
    quizQuestions.forEach((q, qIndex) => {
        const slide = document.createElement('div');
        slide.className = "slide";
        slide.id = `slide-${totalPresentationSlides + qIndex}`;
        
        let optionsHTML = '';
        q.options.forEach((opt, oIndex) => {
            optionsHTML += `<div class="quiz-option" onclick="checkAnswer(${qIndex}, ${oIndex}, this)">${opt}</div>`;
        });

        slide.innerHTML = `
            <div class="content-layer" style="justify-content: center; align-items: center; width:100%;">
                <div class="quiz-container">
                    <div style="font-size:0.8rem; text-transform:uppercase; color:var(--accent-orange); margin-bottom:5px;">Question ${qIndex + 1} of 6</div>
                    <h3 style="margin-top:0; font-size:1.4rem; border-left: 4px solid var(--accent-orange); padding-left:10px; font-style:italic;">"${q.headline}"</h3>
                    <p style="font-size:1.1rem; opacity:0.9; margin-bottom:20px;">${q.question}</p>
                    <div id="options-box-${qIndex}">${optionsHTML}</div>
                    <button class="next-btn" id="quiz-next-${qIndex}" style="display:none;" onclick="nextSlide()">Next Question</button>
                </div>
            </div>`;
        container.appendChild(slide);
    });

    // Final Report Card Slide
    const reportSlide = document.createElement('div');
    reportSlide.className = "slide";
    reportSlide.id = `slide-${totalPresentationSlides + quizQuestions.length}`;
    reportSlide.innerHTML = `
        <div class="content-layer" style="justify-content: center; align-items: center; width:100%;">
            <div class="report-card">
                <h2 style="margin:0; color:#fff;">Lesson Complete!</h2>
                <div style="font-size: 1.2rem; margin-top:10px;">Your Score: <span id="final-score" style="font-weight:bold; color:var(--accent-orange);">0</span> / 6</div>
                <div class="rank-title" id="final-rank">Evaluating...</div>
                <p id="rank-desc" style="line-height:1.5; opacity:0.8;"></p>
                <button class="next-btn" style="position:relative; bottom:0; right:0; margin: 30px auto 0 auto; display:block;" onclick="restartLesson()">Restart Lesson</button>
            </div>
        </div>`;
    container.appendChild(reportSlide);
}

function checkAnswer(qIndex, selectedIndex, element) {
    const q = quizQuestions[qIndex];
    const optionsBox = document.getElementById(`options-box-${qIndex}`);
    const options = optionsBox.getElementsByClassName('quiz-option');
    
    for(let opt of options) { opt.style.pointerEvents = 'none'; }
    
    if (selectedIndex === q.answer) {
        element.classList.add('correct');
        userScore++;
    } else {
        element.classList.add('wrong');
        options[q.answer].classList.add('correct');
    }
    
    document.getElementById(`quiz-next-${qIndex}`).style.display = 'block';
}

function calculateRank() {
    let title = "";
    let desc = "";
    
    if (userScore === 6) {
        title = "🎯 Master Fact-Checker";
        desc = "Incredible job! You have fully mastered the modern mechanics of clickbait. Mystery tactics and exaggerated claims can't bypass your logical filters.";
    } else if (userScore >= 4) {
        title = "🔍 Savvy Skeptic";
        desc = "Great work! You see through almost all the tricks. You possess a strong analytical eye for dissecting sensational digital headlines.";
    } else if (userScore >= 2) {
        title = "📰 Casual Scroller";
        desc = "Not bad, but you're still occasionally getting hooked. Pay close attention to structural indicators like vague headlines and lists next time!";
    } else {
        title = "🎣 Clickbait Bait";
        desc = "Your emotions are currently driving your clicks instead of your logic! Let's rerun the guide to strengthen your critical reading skills.";
    }
    
    document.getElementById('final-score').innerText = userScore;
    document.getElementById('final-rank').innerText = title;
    document.getElementById('rank-desc').innerText = desc;
}

function showSlide(index) {
    currentSlide = index; // Explicitly synchronize tracking pointer
    const slides = document.querySelectorAll('.slide');
    slides.forEach(s => s.classList.remove('active'));
    
    const targetSlide = document.getElementById(`slide-${index}`);
    if (targetSlide) {
        targetSlide.classList.add('active');
        if (index === totalPresentationSlides + quizQuestions.length) {
            calculateRank();
        }
    }
}

function nextSlide() {
    showSlide(currentSlide + 1);
}

function restartLesson() {
    userScore = 0;
    
    const options = document.getElementsByClassName('quiz-option');
    for (let opt of options) {
        opt.classList.remove('correct', 'wrong');
        opt.style.pointerEvents = 'auto';
    }
    
    quizQuestions.forEach((_, qIndex) => {
        document.getElementById(`quiz-next-${qIndex}`).style.display = 'none';
    });
    
    showSlide(0);
}

init();
</script>
</body>
</html>
